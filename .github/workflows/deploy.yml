name: Deploy sur le VPS

# Ne se déclenche que sur un tag "v*" poussé (ex: v1.0.0), pas sur chaque
# commit — permet de choisir précisément quand mettre le site en prod.
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du tag
        uses: actions/checkout@v4

      - name: Envoi des fichiers sur le VPS (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avz --delete
            --exclude=.git*
            --exclude=data
            --exclude=config.php
            --exclude=.idea
            --exclude=.claude
          path: ./
          remote_path: /home/${{ secrets.VPS_USER }}/yoga-lyengar/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Rebuild + restart du conteneur Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/yoga-lyengar
            docker compose -f docker-compose.prod.yml up -d --build