services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      # Port 80 déjà pris par le nginx existant sur le VPS, qui fait
      # reverse proxy + TLS (Let's Encrypt) vers ce port 8080. Accès
      # restreint à localhost : le conteneur n'est plus exposé directement
      # sur internet, seul nginx peut l'atteindre.
      - "127.0.0.1:8080:80"
    volumes:
      # Bind mount du dossier entier : data/horaires.json et config.php
      # (créés au 1er lancement) persistent sur le VPS, pas seulement dans
      # le conteneur — comme en dev, mais avec Apache au lieu du serveur
      # intégré PHP.
      - ./:/var/www/html
